<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат-бот поддержки - Йокогама</title>
    <link href="../css/style.css" rel="stylesheet" type="text/css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body class="chat-page">
    <div class="chat-container">
        <div class="chat-header">
            <h3><i class="fas fa-robot"></i> Чат поддержки Йокогама</h3>
            <div class="status">
                <span class="status-dot"></span>
                <span class="status-text">Online</span>
            </div>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="message bot-message">
                <div class="message-content">
                    <img src="../img/icons/japan-flag.svg" class="icon" alt="Акция">
                    <strong>いらっしゃいませ!</strong><br>
                    Добро пожаловать в суши-бар "Йокогама"! Чем я могу вам помочь?
                </div>
            </div>
        </div>

        <div class="chat-input">
            <div class="quick-questions" id="quickQuestions">
                <!-- Быстрые вопросы будут добавлены через JS -->
            </div>
            <div class="input-container">
                <input type="text" id="userInput" placeholder="Введите ваш вопрос...">
                <button id="sendButton">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Модальное окно для перехода в мессенджер -->
    <div class="modal" id="messengerModal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <img src="../img/icons/japanese-dolls.svg" class="icon" alt="Соцсети">
            <h3>Соединение со специалистом</h3>
            <p>Выберите удобный способ связи:</p>
            <div class="messenger-buttons">
                <button class="messenger-btn telegram">
                    <i class="fab fa-telegram"></i>
                    Telegram
                </button>
                <button class="messenger-btn whatsapp">
                    <i class="fab fa-whatsapp"></i>
                    WhatsApp
                </button>
                <button class="messenger-btn viber">
                    <i class="fab fa-viber"></i>
                    Viber
                </button>
            </div>
        </div>
    </div>

    <script src="../js/chat.js"></script>
</body>

</html>
